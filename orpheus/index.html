<script>
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
// silent loops: like the GIFs in the deck, they play by themselves while on screen; click / Enter / Space pauses
document.querySelectorAll("video[data-loop]").forEach(v => {
  if (calm) return; // reduced motion: keep the native controls, never autoplay
  v.controls = false;
  v.tabIndex = 0;
  v.setAttribute("aria-label", v.getAttribute("aria-label") + " Press Enter to pause or play.");
  let userPaused = false;
  const fig = v.closest("figure");
  const toggle = () => {
    userPaused = !v.paused;
    userPaused ? v.pause() : v.play().catch(() => {});
    fig.classList.toggle("paused", userPaused);
  };
  v.addEventListener("click", toggle);
  v.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting) { if (!userPaused) v.play().catch(() => {}); }
    else v.pause();
  }, { rootMargin: "200px 0px" }).observe(v);
});
// the video with sound plays only when pressed; it stops when scrolled away
document.querySelectorAll("video[data-sound]").forEach(v => {
  new IntersectionObserver(([e]) => { if (!e.isIntersecting) v.pause(); }).observe(v);
});
